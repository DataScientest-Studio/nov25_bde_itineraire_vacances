[theme]
base = "light"

# Couleur primaire - sable doré
primaryColor = "#D4A574"

# Fond principal - sable très clair
backgroundColor = "#F5F1ED"

# Fond secondaire - beige clair
secondaryBackgroundColor = "#EBE5DE"

# Couleur du texte - marron foncé
textColor = "#5C4033"

# Couleurs de la palette
redColor = "#C85A54"           # Terre rouge
orangeColor = "#E68E1A"         # Ocre/or
yellowColor = "#F4D89F"         # Sable clair
blueColor = "#4A90A4"           # Bleu océan
greenColor = "#7BA88F"          # Vert sage
violetColor = "#9B8B84"         # Mauve terre

# Couleur des bordures - marron clair
borderColor = "#D4A574"

# Liens
linkColor = "#4A90A4"

# Police
font = "sans serif"
baseFontSize = 16
baseFontWeight = 400

# Coins arrondis
baseRadius = "medium"

# Afficher les bordures
showWidgetBorder = true
showSidebarBorder = true