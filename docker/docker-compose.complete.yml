
services:
  # Service API FastAPI
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: itinerary-api
    ports:
      - "8000:8000"
    environment:
      - OSRM_URL=http://osrm-multi-regions:5000
      - POSTGRES_HOST=postgres-vacances
      - POSTGRES_PORT=5432
      - POSTGRES_DB=vacances
      - POSTGRES_USER=vacances_user
      - POSTGRES_PASSWORD=vacances_password
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    depends_on:
      postgres-vacances:
        condition: service_healthy
      osrm-multi-regions:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vacances-network

  # Service OSRM avec les 3 régions françaises
  osrm-multi-regions:
    build:
      context: ./osrm
      dockerfile: Dockerfile
    container_name: osrm-france-multi
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data
    environment:
      - OSRM_DATA_PATH=/data/combined.osrm
    restart: unless-stopped
    networks:
      - vacances-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/2.35,48.85;2.36,48.86"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # 5 minutes pour la préparation des données

  # Base de données Métier avec PostGIS
  postgres-vacances:
    image: postgis/postgis:15-3.3
    container_name: postgres-vacances
    environment:
      POSTGRES_USER: vacances_user
      POSTGRES_PASSWORD: vacances_password
      POSTGRES_DB: vacances
    ports:
      - "5433:5432"
    volumes:
      - postgres-vacances-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacances_user -d vacances"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - vacances-network

  # Service de test pour vérifier l'ensemble
  health-check:
    image: curlimages/curl:latest
    container_name: health-check
    depends_on:
      api:
        condition: service_started
      osrm-multi-regions:
        condition: service_healthy
      postgres-vacances:
        condition: service_healthy
    command: >
      sh -c "
        echo ' Test de l architecture complète...'
        echo '📡 Test API...'
        curl -f http://api:8000/docs || echo '⚠️  API en cours de démarrage'
        echo '  Test OSRM...'
        curl -f http://osrm-multi-regions:5000/route/v1/driving/2.35,48.85;2.36,48.86
        echo '  Test PostgreSQL...'
        nc -z postgres-vacances 5432 && echo ' PostgreSQL OK' || echo '❌ PostgreSQL KO'
        echo ' Architecture vérifiée !'
      "
    networks:
      - vacances-network

volumes:
  osrm_data:
    driver: local
  postgres-vacances-data:

networks:
  vacances-network:
    driver: bridge
