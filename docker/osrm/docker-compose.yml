
services:
  # Service OSRM avec les 3 régions françaises et multi-profils
  osrm-multi-regions:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osrm-france-multi
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data
    environment:
      - OSRM_PROFILE=${OSRM_PROFILE:-car}  # car, bike, walk
    restart: unless-stopped
    networks:
      - osrm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/2.35,48.85;2.36,48.86"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # 5 minutes pour la préparation des données

  # Service de test pour vérifier OSRM
  osrm-test:
    image: curlimages/curl:latest
    container_name: osrm-test
    depends_on:
      osrm-multi-regions:
        condition: service_healthy
    command: >
      sh -c "
        echo ' Test de connexion à OSRM...'
        curl -f http://osrm-multi-regions:5000/route/v1/driving/2.35,48.85;2.36,48.86
        echo ''
        echo ' OSRM est fonctionnel !'
      "
    networks:
      - osrm-network

volumes:
  osrm_data:
    driver: local

networks:
  osrm-network:
    driver: bridge
