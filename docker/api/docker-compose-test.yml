version: "3.9"

services:
  osrm-driving:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/france-latest.osrm
    volumes:
      - ./data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  osrm-walking:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/france-latest-foot.osrm
    volumes:
      - ./data:/data
    ports:
      - "5001:5000"
    restart: unless-stopped

  osrm-cycling:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/france-latest-bike.osrm
    volumes:
      - ./data:/data
    ports:
      - "5002:5000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/osrm.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - osrm-driving
      - osrm-walking
      - osrm-cycling
    restart: unless-stopped