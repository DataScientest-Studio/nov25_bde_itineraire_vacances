global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'itinerary-api'
    static_configs:
      - targets: ['itinerary-api:8000']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'osrm-exporter'
    static_configs:
      - targets: ['osrm-exporter:8001']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

