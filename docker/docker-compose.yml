x-airflow-common: &airflow-common
  build:
    context: ..                          
    dockerfile: docker/airflow/Dockerfile
  dns: 8.8.8.8
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Utilisation des variables du .env
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Configuration de la base de données Vacances via .env
    POSTGRES_VACANCES_HOST: ${POSTGRES_VACANCES_HOST}
    POSTGRES_VACANCES_PORT: ${POSTGRES_VACANCES_PORT}
    POSTGRES_VACANCES_DB: ${POSTGRES_VACANCES_DB}
    POSTGRES_VACANCES_USER: ${POSTGRES_VACANCES_USER}
    POSTGRES_VACANCES_PASSWORD: ${POSTGRES_VACANCES_PASSWORD}
    SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/src
    - ../data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
    postgres-vacances:
      condition: service_healthy
  networks:
    - docker_vacances-network

services:
  # --- INFRASTRUCTURE DATA & BDD ---
  # Base de données Métier avec PostGIS
  postgres-vacances:
    image: postgis/postgis:15-3.3
    container_name: postgres-vacances
    environment:
      POSTGRES_USER: ${POSTGRES_VACANCES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_VACANCES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_VACANCES_DB}
    ports:
      - "${POSTGRES_VACANCES_EXTERNAL_PORT}:5432"
    volumes:
      - postgres-vacances-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_VACANCES_USER} -d ${POSTGRES_VACANCES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - docker_vacances-network

  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_AIRFLOW_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - docker_vacances-network

  # Interface d'administration BDD
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-amadouadjanouhoun@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres-vacances
    networks:
      - docker_vacances-network


  # --- SERVICES OSRM (PROFILS) ---
  
  osrm-init:
    profiles: ["osrm_compilation"]
    build:
      context: ..
      dockerfile: docker/osrm/Dockerfile.init
    container_name: osrm-init
    volumes:
      - ../osrm-setup:/osrm-setup
    environment:
      - DEBIAN_FRONTEND=noninteractive
    networks:
      - vacances-network
    command: /osrm-setup.sh
    restart: "no"

  osrm-compiler-car:
    profiles: ["osrm_compilation"]
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-compiler-car
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    volumes:
      - ../osrm-setup/data:/data
    networks:
      - vacances-network
    command: sh -c "
      osrm-extract -p /opt/car.lua /data/france-3regions-car.osm.pbf &&
      osrm-partition /data/france-3regions-car.osrm &&
      osrm-customize /data/france-3regions-car.osrm"
    restart: "no"

  osrm-compiler-bike:
    profiles: ["osrm_compilation"]
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-compiler-bike
    depends_on:
      osrm-compiler-car:
        condition: service_completed_successfully
    volumes:
      - ../osrm-setup/data:/data
    networks:
      - vacances-network
    command: sh -c "
      osrm-extract -p /opt/bicycle.lua /data/france-3regions-bike.osm.pbf &&
      osrm-partition /data/france-3regions-bike.osrm &&
      osrm-customize /data/france-3regions-bike.osrm"
    restart: "no"

  osrm-compiler-foot:
    profiles: ["osrm_compilation"]
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-compiler-foot
    depends_on:
      osrm-compiler-bike:
        condition: service_completed_successfully
    volumes:
      - ../osrm-setup/data:/data
    networks:
      - vacances-network
    command: sh -c "
      osrm-extract -p /opt/foot.lua /data/france-3regions-foot.osm.pbf &&
      osrm-partition /data/france-3regions-foot.osrm &&
      osrm-customize /data/france-3regions-foot.osrm"
    restart: "no"

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-car
    volumes:
      - ../osrm-setup/data:/data
    environment:
      - MAX_LOCATIONS_DISTANCE_TABLE=1500
      - MAX_LOCATIONS_MAP_MATCHING=100
      - MAX_LOCATIONS_NEAREST=100
      - MAX_LOCATIONS_TRIP=100
    command: osrm-routed --algorithm mld /data/france-3regions-car.osrm
    restart: unless-stopped
    networks:
      - vacances-network

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-bike
    volumes:
      - ../osrm-setup/data:/data 
    environment:
      - MAX_LOCATIONS_DISTANCE_TABLE=1500
      - MAX_LOCATIONS_MAP_MATCHING=100
      - MAX_LOCATIONS_NEAREST=100
      - MAX_LOCATIONS_TRIP=100
    command: osrm-routed --algorithm mld /data/france-3regions-bike.osrm
    restart: unless-stopped
    networks:
      - vacances-network

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-foot
    volumes:
      - ../osrm-setup/data:/data
    environment:
      - MAX_LOCATIONS_DISTANCE_TABLE=1500
      - MAX_LOCATIONS_MAP_MATCHING=100
      - MAX_LOCATIONS_NEAREST=100
      - MAX_LOCATIONS_TRIP=100
    command: osrm-routed --algorithm mld /data/france-3regions-foot.osrm
    restart: unless-stopped
    networks:
      - vacances-network

  # --- NGINX REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: nginx-osrm
    ports:
      - "5000:80"
    volumes:
      - ../osrm-setup/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - osrm-car
      - osrm-bike
      - osrm-foot
    restart: unless-stopped
    networks:
      - vacances-network

  # --- SERVICE API ---

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: itinerary-api
    ports:
      - "8000:8000"
    environment:
      - OSRM_URL_CAR=http://osrm-car:5000
      - OSRM_URL_BIKE=http://osrm-bike:5000
      - OSRM_URL_FOOT=http://osrm-foot:5000
      - POSTGRES_VACANCES_HOST=postgres-vacances
      - POSTGRES_VACANCES_PORT=5432
      - POSTGRES_VACANCES_DB=${POSTGRES_VACANCES_DB}
      - POSTGRES_VACANCES_USER=${POSTGRES_VACANCES_USER}
      - POSTGRES_VACANCES_PASSWORD=${POSTGRES_VACANCES_PASSWORD}
    volumes:
      - ../app:/app/app
      - ../logs:/app/logs
    depends_on:
      postgres-vacances:
        condition: service_healthy
      osrm-car:
        condition: service_started
      osrm-bike:
        condition: service_started
      osrm-foot:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - docker_vacances-network

  # --- SERVICES STREAMLIT ---

  streamlit:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
        - vacances-network
    
  
  # --- SERVICES AIRFLOW ---

  airflow-webserver:
      <<: *airflow-common
      container_name: airflow-webserver
      command: webserver
      ports:
        - "8080:8080"
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-scheduler:
      <<: *airflow-common
      container_name: airflow-scheduler
      command: scheduler
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-init:
      <<: *airflow-common
      container_name: airflow-init
      entrypoint: /bin/bash
      command:
        - -c
        - |
          mkdir -p /sources/logs /sources/dags /sources/plugins /sources/data /sources/data/processed /sources/data/raw /sources/src
          chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins,data,src}
          chmod -R 755 /sources/{logs,dags,plugins,data,src}
          exec /entrypoint airflow db migrate
          airflow users create \
          --username airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com \
          --password airflow 
      environment:
        <<: *airflow-common-env
        _AIRFLOW_DB_MIGRATE: 'true'
        _AIRFLOW_WWW_USER_CREATE: 'true'
        _AIRFLOW_WWW_USER_USERNAME: airflow
        _AIRFLOW_WWW_USER_PASSWORD: airflow
      user: "0:0"
      volumes:
        - ..:/sources

volumes:
  postgres-airflow-data:
  postgres-vacances-data:
  pgadmin-data:

networks:
  docker_vacances-network:
    driver: bridge